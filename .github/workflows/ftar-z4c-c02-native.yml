name: FTAR Z4c C0.2 native tests

on:
  push:
    branches: [ftar-z4c-c0-build]
  workflow_dispatch:

jobs:
  native-z4c:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran git subversion curl wget perl python3 python3-pip pkg-config cmake ninja-build ccache openmpi-bin libopenmpi-dev libhdf5-openmpi-dev libfftw3-dev libgsl-dev libssl-dev liblapack-dev libopenblas-dev libhwloc-dev libboost-all-dev
      - name: Fetch ET_2026_05 Hypatia
        run: |
          curl -fsSLO https://raw.githubusercontent.com/gridaphobe/CRL/ET_2026_05/GetComponents
          chmod +x GetComponents
          ./GetComponents --shallow https://bitbucket.org/einsteintoolkit/manifest/raw/ET_2026_05/einsteintoolkit.th
      - name: Add FTARScalarX
        run: |
          mkdir -p Cactus/arrangements/FTAR
          cp -a z4c_c0/FTARScalarX Cactus/arrangements/FTAR/
          curl -fsSL https://bitbucket.org/einsteintoolkit/manifest/raw/ET_2026_05/einsteintoolkit.th -o ftar-z4c.th
          printf '\n# Local FTAR thorn\nFTAR/FTARScalarX\n' >> ftar-z4c.th
      - name: Build
        run: |
          cd Cactus
          ./simfactory/bin/sim setup-silent
          ./simfactory/bin/sim build -j2 --thornlist ../ftar-z4c.th 2>&1 | tee ../build-c02.log
      - name: Run linear wave Z4c
        run: |
          cd Cactus
          ./simfactory/bin/sim create-run c02-linear-wave --parfile arrangements/Cottonmouth/CottonmouthZ4c4m/test/linear_wave_z4c.par --procs 1 --num-threads 1 2>&1 | tee ../linear-wave-c02.log
      - name: Run QC0 Z4c
        run: |
          cd Cactus
          ./simfactory/bin/sim create-run c02-qc0 --parfile arrangements/Cottonmouth/CottonmouthZ4c4m/test/qc0_z4c.par --procs 1 --num-threads 1 2>&1 | tee ../qc0-c02.log
      - name: Collect diagnostics
        if: always()
        run: |
          tail -400 build-c02.log > build-c02-tail.txt || true
          tail -400 linear-wave-c02.log > linear-wave-c02-tail.txt || true
          tail -400 qc0-c02.log > qc0-c02-tail.txt || true
          find "$HOME/simulations" -maxdepth 7 -type f \( -name '*.out' -o -name '*.err' -o -name 'summary.log' \) -print > simulation-files-c02.txt 2>/dev/null || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftar-z4c-c02-native-diagnostics
          path: |
            build-c02.log
            build-c02-tail.txt
            linear-wave-c02.log
            linear-wave-c02-tail.txt
            qc0-c02.log
            qc0-c02-tail.txt
            simulation-files-c02.txt
