name: FTAR Z4c C0.1 direct Cactus build

on:
  push:
    branches: [ftar-z4c-c0-build]
  workflow_dispatch:

jobs:
  direct-cactus-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran git subversion curl wget perl python3 python3-pip pkg-config cmake ninja-build ccache openmpi-bin libopenmpi-dev libhdf5-openmpi-dev libfftw3-dev libgsl-dev libssl-dev liblapack-dev libopenblas-dev libhwloc-dev libboost-all-dev

      - name: Fetch ET_2026_05 Hypatia
        run: |
          set -euo pipefail
          curl -fsSLO https://raw.githubusercontent.com/gridaphobe/CRL/ET_2026_05/GetComponents
          chmod +x GetComponents
          ./GetComponents --shallow https://bitbucket.org/einsteintoolkit/manifest/raw/ET_2026_05/einsteintoolkit.th

      - name: Add FTARScalarX
        run: |
          set -euo pipefail
          mkdir -p Cactus/arrangements/FTAR
          cp -a z4c_c0/FTARScalarX Cactus/arrangements/FTAR/

      - name: Generate local Cactus ThornList
        run: |
          set -euo pipefail
          cd Cactus
          find arrangements -mindepth 3 -maxdepth 3 -type f -name interface.ccl -print \
            | sed -E 's#^arrangements/([^/]+)/([^/]+)/interface\.ccl$#\1/\2#' \
            | sort -u > ../ftar-c0-local.th
          grep -qx 'FTAR/FTARScalarX' ../ftar-c0-local.th
          echo "Thorns selected: $(wc -l < ../ftar-c0-local.th)"
          grep -E 'CottonmouthZ4c4m|CarpetX|TmunuBaseX|ODESolvers|FTARScalarX' ../ftar-c0-local.th

      - name: Configure directly with Cactus make system
        run: |
          set -euo pipefail
          cd Cactus
          make ftar-c0-config THORNLIST=../ftar-c0-local.th PROMPT=no 2>&1 | tee ../configure-c01.log

      - name: Build directly with Cactus make system
        run: |
          set -euo pipefail
          cd Cactus
          make -j2 ftar-c0 2>&1 | tee ../build-c01.log
          test -x exe/cactus_ftar-c0
          ./exe/cactus_ftar-c0 -T 2>&1 | tee ../thorn-list-c01.log

      - name: Source-account Tmunu writes
        run: |
          set -euo pipefail
          cd Cactus
          {
            echo '=== FTARScalarX writes to TmunuBaseX ==='
            grep -R -n -E 'eT(tt|tx|ty|tz|xx|xy|xz|yy|yz|zz).*([+]=|=)' arrangements/FTAR/FTARScalarX || true
            echo '=== FTARScalarX schedule ==='
            cat arrangements/FTAR/FTARScalarX/schedule.ccl
            echo '=== TmunuBaseX zero/add schedule references ==='
            grep -R -n -E 'ZeroTmunu|eTtt|eTtx|eTxx' arrangements/CarpetX arrangements/*/TmunuBaseX 2>/dev/null | head -300 || true
            echo '=== Cottonmouth RHS schedule ==='
            grep -R -n -E 'z4c_rhs_group|Tmunu|RHSGroup' arrangements/Cottonmouth/CottonmouthZ4c4m 2>/dev/null | head -300 || true
          } | tee ../tmunu-accounting-c01.log

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          tail -400 configure-c01.log > configure-c01-tail.txt 2>/dev/null
          tail -500 build-c01.log > build-c01-tail.txt 2>/dev/null
          cp Cactus/configs/ftar-c0/ThornList thornlist-c01.txt 2>/dev/null
          find Cactus/configs/ftar-c0 -maxdepth 3 -type f -name '*error*' -o -name 'config.log' 2>/dev/null | sort > config-diagnostic-files.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftar-z4c-c01-direct-build-diagnostics
          path: |
            configure-c01.log
            configure-c01-tail.txt
            build-c01.log
            build-c01-tail.txt
            thorn-list-c01.log
            thornlist-c01.txt
            tmunu-accounting-c01.log
            config-diagnostic-files.txt
            ftar-c0-local.th
